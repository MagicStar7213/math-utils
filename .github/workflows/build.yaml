name: Build

on:
  push:
  release:
    types: published

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' # Version range or exact version of a Python version to use, using SemVer's version range syntax
          architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Executable
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: mathutils
          python-flag: -m
          mode: app
          company-name: Breixo Montenegro
          product-name: Math utils
          product-version: 0.4
          copyright: GPL 3.0
          macos-app-console-mode: force
          macos-app-name: Math utils
          macos-app-version: 0.4
          jobs: -1
          low-memory: on
          nofollow-import-to: sympy.physics,sympy.combinatorics,sympy.differential_geometry,sympy.stats,sympy.vector,sympy.parsing.latex
          clang: on

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }} Build
          path: |
            build/*.exe
            build/*.bin
            build/*.app/**/*
            build/*.dist/**/*
          include-hidden-files: true